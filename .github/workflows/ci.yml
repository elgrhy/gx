name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Check examples
        shell: bash
        run: |
          ./target/debug/gx check docs/examples/hello_world.gx
          ./target/debug/gx check docs/examples/calculator.gx
          ./target/debug/gx check docs/examples/simple_agent.gx
          ./target/debug/gx check docs/examples/ai_assistant.gx

      - name: Run examples
        shell: bash
        run: |
          ./target/debug/gx run docs/examples/hello_world.gx
          ./target/debug/gx run docs/examples/calculator.gx
          ./target/debug/gx run docs/examples/simple_agent.gx

  build-release:
    name: Build release binaries
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: gx-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: gx-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: gx-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gx-windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/gx
            target/${{ matrix.target }}/release/gx.exe
