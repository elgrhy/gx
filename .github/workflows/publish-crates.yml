name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being published (informational)'
        required: false
        default: 'latest'

permissions:
  id-token: write   # Required to request an OIDC JWT from GitHub Actions
  contents: read

jobs:
  publish:
    name: Publish gx to crates.io
    runs-on: ubuntu-latest
    environment: crates-io   # Must match the Trusted Publisher environment on crates.io
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Log version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "Publishing gx v$VERSION to crates.io"

      # Step 1: Request a GitHub OIDC JWT with audience "crates.io"
      # Step 2: Exchange it at crates.io's Trusted Publishing endpoint for a temporary API token
      # Step 3: Set CARGO_REGISTRY_TOKEN so cargo publish can use it
      - name: Mint crates.io token via Trusted Publishing
        id: mint
        run: |
          OIDC_TOKEN=$(curl -sS \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value')

          RESPONSE=$(curl -sS --fail-with-body \
            -X POST https://crates.io/api/v1/trusted_publishing/github_actions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OIDC_TOKEN}")

          TOKEN=$(echo "${RESPONSE}" | jq -r '.token')
          echo "::add-mask::${TOKEN}"
          echo "CARGO_REGISTRY_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

      - name: Publish to crates.io
        run: cargo publish --locked
