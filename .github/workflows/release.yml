name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.4.0)'
        required: false

permissions:
  contents: write
  id-token: write   # Required for crates.io Trusted Publishing (OIDC)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: gx
            archive: gx-linux-x64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: gx
            archive: gx-linux-arm64.tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: gx
            archive: gx-macos-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: gx
            archive: gx-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: gx.exe
            archive: gx-windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Only create a GitHub Release on an actual tag push. On manual
      # workflow_dispatch (branch ref) there is no tag, so this step is skipped
      # and the downstream publish jobs still run for testing.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## GX Language ${{ github.ref_name }}

            ### Install

            ```bash
            # npm
            npm install -g gxlang

            # Cargo
            cargo install gxlang

            # One-line script
            curl -sSf https://raw.githubusercontent.com/elgrhy/gx/main/install.sh | sh
            ```

            Or download a binary for your platform below.

            ### What's new
            See the [README](https://github.com/elgrhy/gx#readme) for the full changelog.

  # Publish the `gxlang` crate to crates.io. Idempotent: if the version is
  # already on the index (e.g. published manually), the job skips cleanly instead
  # of failing. Requires the CARGO_REGISTRY_TOKEN secret.
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (skip if version already exists)
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          EXISTS=$(curl -s -H "User-Agent: gxlang-ci (release)" \
            "https://crates.io/api/v1/crates/gxlang/${VERSION}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if d.get('version') else 'no')" 2>/dev/null || echo "no")
          if [ "$EXISTS" = "yes" ]; then
            echo "gxlang ${VERSION} already on crates.io — skipping."
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publish the npm package. Idempotent: skips if the version already exists
  # (e.g. published manually). Requires the NPM_TOKEN secret.
  # NOTE: if the npm account enforces 2FA on publish, NPM_TOKEN must be a
  # granular/automation token with "bypass 2FA" enabled, otherwise publish a
  # fresh version manually with `npm publish` from the npm/ directory.
  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm package (skip if version already exists)
        working-directory: npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "gxlang@${VERSION}" version >/dev/null 2>&1; then
            echo "gxlang@${VERSION} already on npm — skipping."
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
