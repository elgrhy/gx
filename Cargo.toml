[package]
name = "gx"
version = "0.1.3"
edition = "2021"
description = "GX — brain-first programming language for building transparent AI assistants"
authors = ["Ahmed Elgarhy <ahmed@devjsx.com>"]

[[bin]]
name = "gx"
path = "src/main.rs"

[lib]
name = "gx_runtime"
path = "src/lib.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
