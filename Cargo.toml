[package]
name = "gxlang"
version = "0.7.0"
edition = "2021"
description = "GX — brain-first programming language for building transparent, auditable AI assistants and production applications. Capability-sandboxed process/HTTP/database runtimes, task concurrency, diagnostics, testing, and a debugger — every AI call logged, every decision explicit, every agent debuggable."
authors = ["Ahmed Elgarhy <ahmed@devjsx.com>"]
license = "MIT"
homepage = "https://github.com/elgrhy/gx"
repository = "https://github.com/elgrhy/gx"
documentation = "https://github.com/elgrhy/gx#readme"
keywords = ["ai", "agent", "language", "llm", "interpreter"]
categories = ["command-line-utilities", "development-tools", "parsing"]
readme = "README.md"
exclude = [
    "tests/tmp/*",
    "tests/.env.test",
    "self/*",
    "examples/*",
    "docs/*",
    "Formula/*",
    ".github/*",
]

[[bin]]
name = "gx"
path = "src/main.rs"

[lib]
name = "gx_runtime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only (HTTP client + server — not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq    = { version = "2", features = ["json", "tls"], default-features = false }
tiny_http = "0.12"
regex   = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
chrono  = { version = "0.4", features = ["serde"] }
csv     = "1"
serde_yaml = "0.9"
toml    = "0.8"
sha2    = "0.10"
uuid    = { version = "1", features = ["v4"] }
glob    = "0.3"
hmac    = "0.12"
subtle  = "2"
getrandom = "0.2"
ed25519-dalek = "2"
jsonwebtoken = "9"
# Package resolution (Module & Package Runtime): hand-rolling semver range
# matching is a real correctness risk for a feature whose entire point is
# reproducible builds — pre-release ordering, caret/tilde range semantics,
# etc. are easy to get subtly wrong. `semver` is the same crate Cargo
# itself uses for this, zero-dependency, and tiny.
semver = "1"

# WASM-only
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
strip = true

[profile.release.package."*"]
opt-level = 3
