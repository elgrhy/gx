[package]
name = "gx"
version = "0.2.4"
edition = "2021"
description = "GX — brain-first programming language for building transparent AI assistants"
authors = ["Ahmed Elgarhy <ahmed@devjsx.com>"]

[[bin]]
name = "gx"
path = "src/main.rs"

[lib]
name = "gx_runtime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only (HTTP client + server — not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }
tiny_http = "0.12"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

# WASM-only
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
strip = true

[profile.release.package."*"]
opt-level = 3
