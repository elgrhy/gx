[package]
name = "gxlang"
version = "0.5.1"
edition = "2021"
description = "GX — brain-first programming language for building transparent, auditable AI assistants. Every AI call logged, every decision explicit, every agent debuggable."
authors = ["Ahmed Elgarhy <ahmed@devjsx.com>"]
license = "MIT"
homepage = "https://github.com/elgrhy/gx"
repository = "https://github.com/elgrhy/gx"
documentation = "https://github.com/elgrhy/gx#readme"
keywords = ["ai", "agent", "language", "llm", "interpreter"]
categories = ["command-line-utilities", "development-tools", "parsing"]
readme = "README.md"
exclude = [
    "tests/tmp/*",
    "tests/.env.test",
    "self/*",
    "examples/*",
    "docs/*",
    "Formula/*",
    ".github/*",
]

[[bin]]
name = "gx"
path = "src/main.rs"

[lib]
name = "gx_runtime"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only (HTTP client + server — not available in WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq    = { version = "2", features = ["json", "tls"], default-features = false }
tiny_http = "0.12"
regex   = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono  = { version = "0.4", features = ["serde"] }
csv     = "1"
serde_yaml = "0.9"
toml    = "0.8"
sha2    = "0.10"
uuid    = { version = "1", features = ["v4"] }
glob    = "0.3"
hmac    = "0.12"
subtle  = "2"
getrandom = "0.2"
ed25519-dalek = "2"
jsonwebtoken = "9"

# WASM-only
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
strip = true

[profile.release.package."*"]
opt-level = 3
